[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mag-calibration"
version = "1.0.0"
description = "Изолированный десктопный модуль 3D-калибровки магнетометра для PyQt6"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.4.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.22.0",
    "scipy>=1.8.0",
]

[tool.setuptools]
# Автоматический и безопасный поиск всех пакетов и подпакетных папок
packages = { find = { namespaces = false } }

[tool.setuptools.package-data]
"mag_calibration" = ["translations/*.qm"]
